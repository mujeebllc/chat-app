worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream chat_backend {
        # enable sticky sessions based on IP, though socket.io redis adapter handles it mostly, 
        # ip_hash is good for socket.io long-polling fallback.
        ip_hash;
        
        server backend-1:5001;
        server backend-2:5001;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://chat_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400; # allow long-running connections
        }
    }
}
